<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장미, 그리고 쫀드기</title>
<style>
  @font-face { font-family: 'Gowun Batang'; src: url(fonts/GowunBatang-Bold.ttf); font-weight: 700; }
  @font-face { font-family: 'Nanum Myeongjo'; src: url(fonts/NanumMyeongjo-Regular.ttf); }
  @font-face { font-family: 'Jua'; src: url(fonts/Jua-Regular.ttf); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; }
  #play {
    position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
    font: bold 20px sans-serif; padding: 14px 28px; border: 0; border-radius: 999px;
    background: #f08a5d; color: #fff; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  body.capture canvas { height: auto; width: 720px; }
  body.capture #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<button id="play">▶ 소리 켜고 재생</button>
<audio id="snd" src="rose-jjondeugi-match.wav" preload="auto"></audio>
<script>
// 30초: 장미와 쫀드기의 닮은 모양·색깔. 1막은 우아한 슬로우모션, 2막은 귀엽게.
// 타임라인은 make_audio.py 와 같아야 소리가 맞는다.
const W = 720, H = 1280, T = 30;
const ELEGANT = '"Gowun Batang", serif', THIN = '"Nanum Myeongjo", serif', CUTE = 'Jua, sans-serif';
const ACT2 = 15.5, BEAT = 0.3;           // 2막 시작과 박자
const ROSE_W = [2000, 1126], S = H / 1126;
const BUD_AT = [737, 290];               // 넓은 사진에서 bud.png 위치

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const between = (t, a, b) => t >= a && t < b;
const fadeIO = (t, a, b, f = 0.4) => smooth(a, a + f, t) * (1 - smooth(b - f, b, t));
const beatPulse = t => t < ACT2 ? 0 : Math.exp(-(((t - ACT2) / BEAT) % 1) * 5);

const imgs = {};
const SRC = { plate: 'plate.jpg', bud: 'bud.png', close: 'src/rose-close.jpg', strip: 'strip.png',
  jjClose: 'src/jj-closeup.jpg', jjPlate: 'src/jj-plate.jpg', jjGrilled: 'src/jj-grilled.jpg' };
const ready = Promise.all([
  ...Object.entries(SRC).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = res; im.src = src; imgs[k] = im; })),
  ...['700 40px "Gowun Batang"', '40px "Nanum Myeongjo"', '40px Jua'].map(f => document.fonts.load(f, '장미쫀드기')),
]);

// 사진 한 장을 화면에 놓는다: 사진 좌표 (cx, cy) 가 (ox, oy) 에 오도록, s 배율과 rot 회전으로
function shot(img, ww, wh, cx, cy, s, rot = 0, ox = W / 2, oy = H / 2) {
  ctx.save(); ctx.translate(ox, oy); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-cx, -cy);
  ctx.drawImage(img, 0, 0, ww, wh); ctx.restore();
}

// ---------- 떨어지는 꽃잎 (bud.png 의 앞쪽 큰 꽃잎) ----------
function petalPath(c) {
  c.beginPath(); c.moveTo(165, 335);
  c.bezierCurveTo(230, 250, 330, 200, 468, 172);
  c.bezierCurveTo(440, 300, 400, 420, 250, 495);
  c.bezierCurveTo(190, 470, 160, 400, 165, 335); c.closePath();
}
const PETAL_C = [315, 335];
function petalPose(t) {
  const k = smooth(9.2, 12.3, t), sway = Math.sin(k * Math.PI * 2.4);
  return { x: lerp(BUD_AT[0] + PETAL_C[0], 1180, k) + 70 * sway * Math.sin(k * Math.PI),
    y: lerp(BUD_AT[1] + PETAL_C[1], 1010, k), r: 0.5 * sway * Math.sin(k * Math.PI) + 1.3 * k, sc: lerp(1, 0.85, k) };
}
function drawPetal(p, glow) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(p.sc, p.sc); ctx.translate(-PETAL_C[0], -PETAL_C[1]);
  if (glow > 0) { ctx.shadowColor = `rgba(255,220,150,${glow})`; ctx.shadowBlur = 40; }
  petalPath(ctx); ctx.fillStyle = '#f2b13a'; ctx.fill();
  ctx.shadowBlur = 0; ctx.clip(); ctx.drawImage(imgs.bud, 0, 0);
  ctx.restore();
}

// ---------- 돌돌 말리는 쫀드기 ----------
const TH = 80, LS = 1150, SA = 44, SB = TH * 1.03 / (2 * Math.PI);
const SPIRAL = (() => {  // 중심에서부터의 길이 → 각도
  const tab = [[0, 0]]; let len = 0, ph = 0;
  while (len < LS + 10) { const d = 0.01; len += (SA + SB * ph) * d; ph += d; tab.push([len, ph]); }
  return tab;
})();
function phiAt(u) {
  let lo = 0, hi = SPIRAL.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (SPIRAL[m][0] < u) lo = m; else hi = m; }
  const [l0, p0] = SPIRAL[lo], [l1, p1] = SPIRAL[hi];
  return lerp(p0, p1, (u - l0) / (l1 - l0 || 1));
}
const spiralPt = ph => { const r = SA + SB * ph; return [r * Math.cos(ph), r * Math.sin(ph)]; };

// R: 말린 길이. 반환값은 말린 덩어리 중심 (바닥 y=0, 처음 오른쪽 끝 x=0 기준)
function rollGeom(R) {
  const phOut = phiAt(R), rOut = SA + SB * phOut, a = Math.PI / 2 - phOut;
  return { phOut, rOut, a, cx: -R, cy: -rOut };
}
function drawRoll(c, R, grill = 0) {
  const g = rollGeom(R), im = imgs.strip, ds = 4;
  const ca = Math.cos(g.a), sa = Math.sin(g.a);
  const place = u => { const [x, y] = spiralPt(phiAt(u)); return [g.cx + x * ca - y * sa, g.cy + x * sa + y * ca]; };
  for (let s = 0; s < LS; s += ds) {
    let x, y, ang;
    if (s < LS - R) { x = g.cx - (LS - R - s); y = 0; ang = 0; }
    else {
      const u = LS - s;
      [x, y] = place(u);
      const [x2, y2] = place(Math.max(0, u - 1));
      ang = Math.atan2(y2 - y, x2 - x);
    }
    c.save(); c.translate(x, y); c.rotate(ang);
    c.drawImage(im, (s / LS) * im.width, 0, Math.max(1, im.width * ds / LS), im.height, -ds / 2 - 1, -TH / 2, ds + 2, TH);
    c.restore();
  }
  if (R > LS * 0.85) {  // 가운데: 꽃 심처럼 꼭 말린 끝
    const a = smooth(LS * 0.85, LS, R), cg = c.createRadialGradient(g.cx, g.cy, 0, g.cx, g.cy, 52);
    cg.addColorStop(0, '#ffd84a'); cg.addColorStop(0.6, '#f6a52e'); cg.addColorStop(1, '#e8662a');
    c.globalAlpha = a; c.fillStyle = cg; c.beginPath(); c.arc(g.cx, g.cy, 52, 0, 7); c.fill();
    c.strokeStyle = '#c4521f'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath();
    for (let ph = 0; ph < 9; ph += 0.2) { const r = 4 + ph * 4.6; c.lineTo(g.cx + r * Math.cos(ph + g.a), g.cy + r * Math.sin(ph + g.a)); }
    c.stroke(); c.globalAlpha = 1;
  }
  if (grill > 0) {  // 구운 자국: 말린 덩어리 안쪽을 살짝 어둡게
    const gr = c.createRadialGradient(g.cx, g.cy, 0, g.cx, g.cy, g.rOut + TH / 2);
    gr.addColorStop(0, `rgba(90,30,0,${0.35 * grill})`); gr.addColorStop(1, 'rgba(90,30,0,0)');
    c.globalCompositeOperation = 'source-atop'; c.fillStyle = gr; c.fillRect(g.cx - 400, g.cy - 400, 800, 800);
    c.globalCompositeOperation = 'source-over';
  }
  return g;
}

function leaf(c, x, y, ang, len) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * 0.5, -len * 0.38, len, 0); c.quadraticCurveTo(len * 0.5, len * 0.38, 0, 0);
  const g = c.createLinearGradient(0, -len * 0.3, 0, len * 0.3); g.addColorStop(0, '#5f9447'); g.addColorStop(1, '#2f5e2a');
  c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(220,255,200,0.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(len * 0.05, 0); c.lineTo(len * 0.9, 0); c.stroke();
  c.restore();
}

// 다 말린 쫀드기 장미 (잎 포함). 먹힌 자국을 내려고 따로 캔버스에 그린다.
let roseCanvas;
function jjRose(leafK, bite) {
  if (!roseCanvas) { roseCanvas = document.createElement('canvas'); roseCanvas.width = roseCanvas.height = 700; }
  const c = roseCanvas.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 700, 700);
  const g = rollGeom(LS);
  c.translate(350 - g.cx, 350 - g.cy);
  if (leafK > 0) {
    const L = 230 * leafK;
    leaf(c, g.cx - 60, g.cy + 120, 2.5, L); leaf(c, g.cx + 70, g.cy + 120, 0.7, L); leaf(c, g.cx, g.cy + 160, 1.57, L * 0.8);
  }
  drawRoll(c, LS, 1);
  if (bite > 0) {
    c.globalCompositeOperation = 'destination-out';
    const bx = g.cx + 175, by = g.cy - 150;
    for (let i = 0; i < 6; i++) { const a = -2.4 + i * 0.55; c.beginPath(); c.arc(bx + Math.cos(a) * 50, by + Math.sin(a) * 50, 40, 0, 7); c.fill(); }
    c.beginPath(); c.arc(bx, by, 70, 0, 7); c.fill();
    c.globalCompositeOperation = 'source-over';
  }
  return roseCanvas;
}

// ---------- 글자 ----------
function text(str, x, y, font, fill, alpha = 1, opts = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (opts.spacing) ctx.letterSpacing = opts.spacing;
  if (opts.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = opts.stroke; ctx.lineWidth = opts.sw || 10; ctx.strokeText(str, x, y); }
  if (opts.shadow) { ctx.shadowColor = opts.shadow; ctx.shadowBlur = 18; }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
  ctx.restore();
}
const elegantText = (str, y, t, a, b, size = 52, fill = '#fbf1d9', shadow = 'rgba(0,0,0,0.8)') =>
  text(str, W / 2, y, `700 ${size}px ${ELEGANT}`, fill, fadeIO(t, a, b, 0.6), { shadow, spacing: '4px' });
function cuteText(str, y, t, a, b, size = 66, fill = '#ff6f91') {
  if (!between(t, a, b)) return;
  const age = t - a, pop = Math.min(1, age * 7) * (1 + 0.18 * Math.exp(-age * 9) * Math.sin(age * 30)) * (1 + 0.04 * beatPulse(t));
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(pop, pop);
  text(str, 0, 0, `${size}px ${CUTE}`, fill, 1 - smooth(b - 0.15, b, t), { stroke: '#fff', sw: 14 });
  ctx.restore();
}

function bokeh(t, seed, n, col, alpha) {
  ctx.save();
  for (let i = 0; i < n; i++) {
    const x = (hash(i + seed) * W + t * 12 * (hash(i + 2) - 0.5) * 4) % W, y = (hash(i + seed + 9) * H - t * 20 * hash(i + 4) + H) % H;
    const r = 10 + 40 * hash(i + seed + 5);
    ctx.globalAlpha = alpha * (0.4 + 0.6 * Math.sin(t * 1.3 + i) ** 2);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function pastel(t, a, b) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#fff';  // 물방울 무늬
  for (let y = 0; y < H + 80; y += 80) for (let x = (y / 80) % 2 * 40; x < W + 80; x += 80) {
    ctx.beginPath(); ctx.arc(x, (y + t * 30) % (H + 80) - 40, 10, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function card(img, ww, wh, x, y, w, h, rot, sc, crop) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(160,60,40,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-w / 2 - 14, -h / 2 - 14, w + 28, h + 28, 28); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 18); ctx.clip();
  const [cx, cy, cw, ch] = crop, s = Math.max(w / cw, h / ch);
  ctx.drawImage(img, cx, cy, cw, ch, -cw * s / 2, -ch * s / 2, cw * s, ch * s);
  ctx.restore();
}

function heart(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.bezierCurveTo(-22, -8, -10, -26, 0, -12); ctx.bezierCurveTo(10, -26, 22, -8, 0, 8); ctx.fill();
  ctx.restore();
}

// ---------- 장면 ----------
function sceneMacro(t) {  // 0~5초: 꽃잎 줄무늬를 아주 가까이서 천천히
  const k = smooth(0, 5.4, t);
  shot(imgs.close, ...ROSE_W, lerp(1020, 1050, k), lerp(470, 760, k), S * lerp(3.8, 3.3, k), lerp(0.05, -0.02, k));
}
function sceneWide(t) {  // 5~12.5초: 장미 전체, 꽃잎 하나가 천천히 떨어진다
  const k = smooth(4.6, 9, t);
  ctx.filter = 'brightness(1.04) saturate(1.1)';
  shot(imgs.plate, ...ROSE_W, lerp(1000, 987, k), lerp(560, 563, k), S * lerp(1.7, 1.0, k));
  ctx.filter = 'none';
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(S * lerp(1.7, 1.0, k), S * lerp(1.7, 1.0, k)); ctx.translate(-lerp(1000, 987, k), -lerp(560, 563, k));
  ctx.filter = 'brightness(1.04) saturate(1.1)';
  ctx.drawImage(imgs.bud, ...BUD_AT);
  if (t >= 9.2) drawPetal(petalPose(t), 0.6 * fadeIO(t, 9.2, 12.6, 0.5));
  ctx.filter = 'none';
  ctx.restore();
  bokeh(t, 3, 14, 'rgba(255,236,200,0.9)', 0.35);
}
function sceneZoomPetal(t) {  // 12.3~13.6초: 내려앉은 꽃잎 속으로
  const k = smooth(12.3, 13.4, t), p = petalPose(12.3);
  const z = S * lerp(1, 4.5, k);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(lerp(0, -p.r + Math.PI / 2, k)); ctx.scale(z, z); ctx.translate(-lerp(987, p.x, k), -lerp(563, p.y, k));
  ctx.drawImage(imgs.plate, 0, 0, ...ROSE_W); ctx.drawImage(imgs.bud, ...BUD_AT);
  drawPetal(p, 0.3);
  ctx.restore();
}
function sceneSplit(t) {  // 13.4~15.5초: 위는 꽃잎, 아래는 쫀드기. 같은 방향의 줄무늬
  const slide = 1 - smooth(13.6, 14.2, t);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H / 2); ctx.clip();
  shot(imgs.close, ...ROSE_W, 1035, 640, S * 2.6 * (1 + 0.04 * (t - 13.4)), Math.PI / 2 - 0.1, W / 2 - slide * W, H / 4);
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, H / 2, W, H / 2); ctx.clip();
  shot(imgs.jjClose, 923, 582, 560, 362, 2.4 * (1 + 0.04 * (t - 13.4)), 0.45, W / 2 + slide * W, H * 3 / 4);
  ctx.restore();
  ctx.fillStyle = '#f3d9a4'; ctx.fillRect(0, H / 2 - 2, W, 4);
}
function sceneReveal(t) {  // 15.5~17.6초: 귀여운 2막, 쫀드기 사진
  pastel(t, '#ffe3ea', '#ffd1b8');
  const b = beatPulse(t);
  if (t < 16.6) {
    const pop = elasticIn(t - ACT2);
    card(imgs.jjPlate, 800, 500, W / 2, 650, 560, 420, -0.05 + 0.02 * Math.sin(t * 6), pop * (1 + 0.03 * b), [60, 20, 700, 450]);
  } else {
    const pop = elasticIn(t - 16.6);
    card(imgs.jjGrilled, 620, 827, W / 2, 680, 480, 600, 0.05 + 0.02 * Math.sin(t * 6), pop * (1 + 0.03 * b), [0, 150, 620, 650]);
  }
}
const elasticIn = a => a <= 0 ? 0 : a >= 1 ? 1 : 1 - Math.pow(2, -10 * a) * Math.cos(a * 18);

function sceneCurl(t) {  // 17.6~22.2초: 슬로우모션으로 돌돌 말려 장미가 된다
  const g0 = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, H * 0.7);
  g0.addColorStop(0, '#fff6e6'); g0.addColorStop(1, '#ffd9c2'); ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);
  bokeh(t, 21, 16, 'rgba(255,170,150,0.8)', 0.4);
  const k = smooth(17.9, 21.4, t), R = LS * k, g = rollGeom(R);
  const sc = lerp(0.58, 1.15, smooth(18.6, 21.6, t));
  // 처음엔 띠 전체가, 끝엔 말린 덩어리가 화면 가운데 오도록
  const fx = lerp(-LS / 2, g.cx, smooth(17.9, 21.4, t)), fy = lerp(0, g.cy, smooth(18.6, 21.6, t));
  ctx.save(); ctx.translate(W / 2, H / 2 + 40); ctx.scale(sc, sc); ctx.translate(-fx, -fy);
  ctx.translate(Math.sin(t * 9) * 1.5, 0);
  if (t >= 21.4) {
    const L = 230 * elasticIn((t - 21.4) * 1.3);
    leaf(ctx, g.cx - 60, g.cy + 120, 2.5, L); leaf(ctx, g.cx + 70, g.cy + 120, 0.7, L); leaf(ctx, g.cx, g.cy + 160, 1.57, L * 0.8);
  }
  ctx.shadowColor = 'rgba(180,80,30,0.35)'; ctx.shadowBlur = 25; ctx.shadowOffsetY = 10;
  drawRoll(ctx, R, smooth(18, 21.4, t));
  ctx.restore();
  if (t > 21.4) for (let i = 0; i < 10; i++) {  // 반짝
    const a = i / 10 * Math.PI * 2 + t, r = 300 * smooth(21.4, 22, t);
    heart(W / 2 + Math.cos(a) * r, H / 2 + 40 + Math.sin(a) * r, 1.2 * (1 - smooth(21.8, 22.2, t)), i % 2 ? '#ff8fab' : '#ffc94a');
  }
}

function sceneCompare(t) {  // 22.2~30초: 나란히, 퀴즈, 냠!
  pastel(t, '#fff0f3', '#ffe1cc');
  const beat = Math.floor((t - ACT2) / BEAT), b = beatPulse(t), pop = elasticIn((t - 22.2) * 1.5);
  const leftUp = beat % 2 === 0 ? b : 0, rightUp = beat % 2 ? b : 0;
  const end = smooth(28.6, 29.1, t);
  const y0 = lerp(700, 640, end);
  // 왼쪽: 진짜 장미
  const nod = between(t, 27.8, 28.7) ? Math.sin((t - 27.8) * 14) * 0.12 * (1 - (t - 27.8) / 0.9) : 0;
  ctx.save(); ctx.translate(190, y0 + 150 - 30 * leftUp); ctx.rotate(nod); ctx.scale(pop * 0.62, pop * 0.62);
  ctx.strokeStyle = '#3f7a35'; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(-10, 200, 10, 420); ctx.stroke();
  leaf(ctx, 0, 160, 2.6, 170); leaf(ctx, 5, 250, 0.5, 170);
  ctx.drawImage(imgs.bud, -238, -512);
  ctx.restore();
  // 오른쪽: 쫀드기 장미
  const bite = t >= 27.3 ? 1 : 0;
  const rc = jjRose(1, bite);
  ctx.save(); ctx.translate(530, y0 - 30 * rightUp); ctx.scale(pop * 0.62, pop * 0.62);
  ctx.strokeStyle = '#3f7a35'; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 100); ctx.quadraticCurveTo(10, 400, -10, 620); ctx.stroke();
  ctx.drawImage(rc, -350, -350);
  ctx.restore();
  // 부스러기
  if (between(t, 27.3, 28.4)) for (let i = 0; i < 14; i++) {
    const a = t - 27.3, vx = (hash(i) - 0.3) * 500, vy = -300 - 300 * hash(i + 3);
    ctx.fillStyle = i % 2 ? '#ff7a2f' : '#ffd23f';
    ctx.globalAlpha = 1 - a / 1.1;
    ctx.fillRect(600 + vx * a, y0 - 80 + vy * a + 900 * a * a, 12, 8); ctx.globalAlpha = 1;
  }
  // 하트
  for (let i = 0; i < 8; i++) {
    const p = ((t * 0.25 + hash(i)) % 1);
    heart(60 + hash(i + 7) * 600, H - p * H, 1 + hash(i + 1), `rgba(255,${120 + 60 * hash(i)},150,${0.5 * Math.sin(p * Math.PI)})`);
  }
  cuteText('닮았죠?', 200, t, 22.4, 25.6, 84);
  cuteText('어느 쪽이 장미일까요?', 200, t, 25.6, 27.3, 64, '#ff8a3d');
  if (between(t, 25.6, 27.3)) for (const x of [190, 530]) text('?', x, y0 - 300 - 20 * Math.abs(Math.sin(t * 8 + x)), `90px ${CUTE}`, '#ff8a3d', 1, { stroke: '#fff', sw: 12 });
  cuteText('냠!', 610, t, 27.3, 28.4, 110, '#ff5d5d');
  if (t >= 27.6) {  // 정답 이름표
    const a = smooth(27.6, 27.8, t);
    for (const [x, s, col] of [[190, '진짜 장미', '#4f8f3e'], [530, '쫀드기', '#ff8a3d']]) {
      ctx.save(); ctx.globalAlpha = a; ctx.font = `44px ${CUTE}`; const w = ctx.measureText(s).width + 44;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x - w / 2, y0 + 330, w, 66, 33); ctx.fill();
      ctx.restore();
      text(s, x, y0 + 365, `44px ${CUTE}`, col, a);
    }
  }
  elegantText('장미, 그리고 쫀드기', 1120, t, 28.6, 30.5, 56, '#9a4a22', 'rgba(255,255,255,0.9)');
  text('닮은꼴 발견!', W / 2, 1195, `40px ${CUTE}`, '#ff6f91', smooth(28.9, 29.2, t), { stroke: '#fff', sw: 10 });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < 5.4) sceneMacro(t);
  if (between(t, 4.6, 12.5)) { ctx.globalAlpha = smooth(4.6, 5.4, t); sceneWide(t); ctx.globalAlpha = 1; }
  if (between(t, 12.3, 13.6)) sceneZoomPetal(t);
  if (between(t, 13.2, ACT2)) { ctx.globalAlpha = smooth(13.2, 13.6, t); sceneSplit(t); ctx.globalAlpha = 1; }
  if (between(t, ACT2, 17.6)) sceneReveal(t);
  if (between(t, 17.6, 22.2)) sceneCurl(t);
  if (t >= 22.2) sceneCompare(t);

  // 1막: 부드러운 비네팅과 글자
  if (t < ACT2) {
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(20,8,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    text('가까이 들여다보면', W / 2, 1060, `40px ${THIN}`, '#fff7e8', fadeIO(t, 1.2, 4.6, 0.8), { shadow: 'rgba(0,0,0,0.9)', spacing: '6px' });
    text('a rose', W / 2, 1010, `italic 34px "DejaVu Serif", serif`, '#f6dca8', fadeIO(t, 5.6, 9, 0.7), { shadow: 'rgba(0,0,0,0.9)', spacing: '8px' });
    elegantText('우아한 장미 한 송이', 1080, t, 5.8, 9);
    text('꽃잎 하나가, 천천히', W / 2, 1080, `40px ${THIN}`, '#fff7e8', fadeIO(t, 9.6, 12.4, 0.7), { shadow: 'rgba(0,0,0,0.9)', spacing: '6px' });
    if (t >= 13.6) {
      const a = fadeIO(t, 13.8, ACT2 + 0.2, 0.4);
      ctx.save(); ctx.globalAlpha = 0.6 * a; ctx.fillStyle = '#2a1408';
      ctx.beginPath(); ctx.roundRect(W / 2 - 220, H / 2 - 44, 440, 88, 44); ctx.fill(); ctx.restore();
      elegantText('같은 색, 같은 결', H / 2, t, 13.8, ACT2 + 0.2, 48);
    }
    ctx.fillStyle = `rgba(0,0,0,${1 - smooth(0, 1.2, t)})`; ctx.fillRect(0, 0, W, H);  // 첫 페이드인
  }
  // 2막 글자
  cuteText('사실 이건 쫀드기!', 200, t, ACT2, 16.6);
  cuteText('살짝 구우면?', 200, t, 16.6, 17.6);
  cuteText('돌돌돌~', 200, t, 18.0, 21.4, 72, '#ff8a3d');
  cuteText('장미가 됐다!', 200, t, 21.4, 22.2, 76);
  // 1막→2막 전환 섬광, 끝 페이드아웃
  if (between(t, ACT2 - 0.1, ACT2 + 0.3)) { ctx.fillStyle = `rgba(255,255,255,${1 - smooth(ACT2 - 0.1, ACT2 + 0.3, t)})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = `rgba(0,0,0,${smooth(29.5, 30, t)})`; ctx.fillRect(0, 0, W, H);
}

window.ready = ready;
window.renderAt = render;
if (new URLSearchParams(location.search).has('capture')) {
  document.body.classList.add('capture');
} else {
  const snd = document.getElementById('snd'), btn = document.getElementById('play');
  const start = performance.now();
  btn.onclick = () => { snd.currentTime = 0; snd.play(); btn.remove(); };
  ready.then(function loop() {
    const t = snd.paused ? ((performance.now() - start) / 1000) % T : snd.currentTime;
    render(Math.min(t, T - 0.001));
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
